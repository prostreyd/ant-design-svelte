name: Documentation site

# Builds the documentation site (docs/) and publishes it on GitHub Pages:
# https://prostreyd.github.io/ant-design-svelte/
#
# One-time setup in the repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until that is done the deploy job fails; run the workflow again afterwards ("Run workflow").

# It starts when the CI of a commit on main has finished green (the owner, 2026-11-20: the site shows what passed the tests, and it
# is not made again for a commit that was cancelled by a newer push or whose tests failed). By hand ("Run workflow") it builds the
# latest commit of main at any time. A release does not wait for it and it does not wait for a release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer run waits instead of cancelling a deployment in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A run that follows a CI run needs that run to be green; a manual run always builds.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The commit that the CI tested, not the latest commit of main (a newer push may have come while the CI ran).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/configure-pages@v6

      - name: Build the site
        run: npm run build
        env:
          BASE_PATH: /ant-design-svelte

      - name: Check the built site (links, titles, canonical URLs, sitemap)
        run: npm run verify -w docs
        env:
          BASE_PATH: /ant-design-svelte

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
