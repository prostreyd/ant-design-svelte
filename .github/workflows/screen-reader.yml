# Tests with a real screen reader (Orca with Firefox, through Guidepup) on a GitHub runner. A workflow of its own, so that the CI of
# the library does not wait for it and does not carry its nine minutes on every branch. Since 2026-11-20 it is part of the gate of a
# release: publish.yml publishes only when it was green for the commit of the tag (the run that this workflow made on main, or, when
# there is none for that commit, a run that publish.yml makes itself through `workflow_call` below).
name: Screen reader

# It runs when what the speech depends on changes (the library, the e2e fixtures, the tests of the screen reader, the build and
# the packages). A push that only touches the documentation, the specifications or the rules does not start it. By hand it
# runs at any time. There is no run by schedule (the owner dropped the weekly run on 2026-11-20). The list of paths is kept in
# step with what the build of the fixtures reads by tests/screenReaderWorkflow.test.ts.
on:
  push:
    branches: [main]
    paths:
      - 'src/lib/**'
      - 'e2e/fixtures/**'
      - 'screen-reader/**'
      - 'vite.e2e.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screen-reader.yml'
  pull_request:
    paths:
      - 'src/lib/**'
      - 'e2e/fixtures/**'
      - 'screen-reader/**'
      - 'vite.e2e.config.ts'
      - 'svelte.config.js'
      - 'tsconfig*.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/screen-reader.yml'
  workflow_dispatch:
  # Called by publish.yml for a release whose commit has no run of its own (see the gate there).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orca:
    # The runner that Guidepup itself uses for Orca (Ubuntu 26.04, Linux kernel 7).
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build the e2e fixtures
        run: npx vite build --config vite.e2e.config.ts --outDir "$PWD/tmp/screen-reader/site" --emptyOutDir

      - name: Serve the fixtures
        run: |
          python3 -m http.server 4195 --bind 127.0.0.1 --directory tmp/screen-reader/site > /dev/null 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:4195/ > /dev/null

      - name: Set up the machine for the screen reader
        run: npx -y @guidepup/setup@0.29.3 setup --ci

      - name: Install the dependencies of the screen reader tests
        working-directory: screen-reader
        run: npm ci

      - name: Install the screen reader
        working-directory: screen-reader
        run: npx -y @guidepup/setup@0.29.3 install

      - name: Install Firefox
        working-directory: screen-reader
        run: npx playwright install --with-deps firefox

      - name: Tests with Orca
        working-directory: screen-reader
        run: xvfb-run -a dbus-run-session -- npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screen-reader-results
          path: screen-reader/test-results
          retention-days: 7
