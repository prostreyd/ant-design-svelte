name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (library and documentation site)
        run: |
          npm run check
          npm run check:docs

      - name: Unit and accessibility tests with coverage thresholds
        run: npm run test:coverage

      - name: Build the package
        run: npm run package

      # The documentation site is built and tested under the base path it is deployed to.
      - name: Build the documentation site
        run: npm run build
        env:
          BASE_PATH: /ant-design-svelte

      - name: Install the browser for e2e tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests of the library
        run: npm run test:e2e

      - name: Check and test the documentation site
        run: npm run test:docs
        env:
          BASE_PATH: /ant-design-svelte

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            docs/test-results/
          if-no-files-found: ignore
          retention-days: 7
