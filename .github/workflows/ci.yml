name: CI

on:
  # Every pushed branch, not only main: the full run is the safety net of the smart local checks (`npm run test:affected`),
  # so it has to be green on the branch before the branch is merged or released (CLAUDE.md 8a). A tag does not start it.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The job takes about 20 minutes (the e2e tests of the library and of the site in three engines); a slow runner adds
    # 40% to that, so the limit leaves room for it.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (library and documentation site)
        run: |
          npm run check
          npm run check:docs

      - name: Unit and accessibility tests with coverage thresholds
        run: npm run test:coverage

      - name: Build the package
        run: npm run package

      # The documentation site is built and tested under the base path it is deployed to.
      - name: Build the documentation site
        run: npm run build
        env:
          BASE_PATH: /ant-design-svelte

      # The tests run in Chromium, Firefox and WebKit. The download is cached by the version of Playwright, so most
      # runs only install the system packages.
      - name: Cache the browsers of Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install the browsers for e2e tests
        run: npx playwright install --with-deps chromium firefox webkit
        timeout-minutes: 8

      - name: End-to-end tests of the library
        run: npm run test:e2e

      - name: Check and test the documentation site
        run: npm run test:docs
        env:
          BASE_PATH: /ant-design-svelte

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            docs/test-results/
          if-no-files-found: ignore
          retention-days: 7
