name: Publish to npm

# Publishes the package when a version tag is pushed, for example v0.1.0-alpha.2, with npm Trusted Publishing:
# npm trusts this workflow, so there is no token and no one-time password.
#
# One-time setup on npmjs.com (package svelte-ant-design -> Settings -> Trusted Publisher -> GitHub Actions):
#   user prostreyd, repository ant-design-svelte, workflow filename publish.yml, environment npm,
#   allowed actions: npm publish and npm dist-tag.
# Optional, in the repository (Settings -> Environments -> npm): "Required reviewers" adds a one-click approval
# before anything is published.
#
# Release: record the version in the branch, merge the change into main, then
#   git tag v<version> && git push origin v<version>
# The tag starts these stages, and nothing is published unless every one of them is green:
#   1. guard   the tag matches the version in package.json, the tagged commit is on main, the version is not in npm yet;
#   2. gate    the tests passed for this exact commit: `CI` (lint, types, unit tests with coverage, the package, the e2e tests of the
#              library and of the documentation site in three browsers) and `Screen reader` (Orca). The runs that GitHub already
#              made for the commit when it was pushed to main are waited for and not made again (scripts/release-gate.mjs);
#   2b. ci, screen-reader   a workflow that has no run for this commit (a run that a newer push cancelled, one that Orca was not
#              started for because the push touched no file it depends on) is run here, as a reusable workflow, so a commit that
#              was not tested is never published; a red run stops the release at the gate;
#   3. publish `npm publish` (it runs lint, types, tests and the package build once more).
# A red stage leaves npm untouched. A failed job of a flaky runner (for example the install of the browsers) is run again with
# "Re-run failed jobs" (of the run that failed: the CI run of main or this one), then this job again. A tag with no version in npm
# may be deleted and set again on the fixed commit (CLAUDE.md 8в).
#
# The documentation site is not here: it is built and published by pages.yml after a green CI on main (the owner, 2026-11-20).

on:
  push:
    tags: ['v*']

# One publication at a time.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Stage 1. It fails in a minute, before the 15 minutes of the checks, when the tag cannot be published at all.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag, the commit and the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $VERSION in package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already in npm"
            exit 1
          fi

  # Stage 2. Waits for the tests of this commit and says, for each workflow, `success` (it was green), or `missing` (no run: it is made
  # below). A red run fails this job. The wait is up to 45 minutes, a long one only while a run of main is still going.
  gate:
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read # to read the runs of the commit
    outputs:
      ci: ${{ steps.gate.outputs.ci }}
      orca: ${{ steps.gate.outputs.orca }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: gate
        run: node scripts/release-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # Stage 2b. Only for a workflow that has no run for this commit: the same jobs that run on every branch.
  ci:
    needs: gate
    if: needs.gate.outputs.ci == 'missing'
    uses: ./.github/workflows/ci.yml

  screen-reader:
    needs: gate
    if: needs.gate.outputs.orca == 'missing'
    uses: ./.github/workflows/screen-reader.yml

  # Stage 3. Only after the guard, the gate and the workflows that were run here are green (a skipped one had a green run of its own).
  publish:
    needs: [guard, gate, ci, screen-reader]
    if: ${{ !cancelled() && needs.guard.result == 'success' && needs.gate.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.ci.result) && contains(fromJSON('["success","skipped"]'), needs.screen-reader.result) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify that the publication comes from this workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - name: Use npm 11
        run: npm install -g npm@11

      - run: npm ci

      # `npm publish` runs prepublishOnly first: lint, type check, tests and the package build.
      # A pre-release goes under the tag named in its version (0.1.0-alpha.2 -> alpha). While the latest tag
      # itself points to a pre-release, it follows the new one; once a stable version is latest, it stays.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            npm publish --tag "$TAG"
            if [[ "$(npm view "$NAME" dist-tags.latest)" == *-* ]]; then
              npm dist-tag add "$NAME@$VERSION" latest
            fi
          else
            npm publish
          fi
