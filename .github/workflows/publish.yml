name: Publish to npm

# Publishes the package when a version tag is pushed, for example v0.1.0-alpha.2, with npm Trusted Publishing:
# npm trusts this workflow, so there is no token and no one-time password.
#
# One-time setup on npmjs.com (package svelte-ant-design -> Settings -> Trusted Publisher -> GitHub Actions):
#   user prostreyd, repository ant-design-svelte, workflow filename publish.yml, environment npm,
#   allowed actions: npm publish and npm dist-tag.
# Optional, in the repository (Settings -> Environments -> npm): "Required reviewers" adds a one-click approval
# before anything is published.
#
# Release: record the version in the branch, merge the change into main, then
#   git tag v<version> && git push origin v<version>
# The tag starts three stages, and nothing is published unless every one of them is green:
#   1. guard   the tag matches the version in package.json, the tagged commit is on main, the version is not in npm yet;
#   2. checks  every job of ci.yml (lint, types, unit tests with coverage, the package, the e2e tests of the library and of the
#              documentation site in three browsers), called as a reusable workflow;
#   3. publish `npm publish` (it runs lint, types, tests and the package build once more).
# A red stage leaves npm untouched. A failed job of a flaky runner (for example the install of the browsers) is run again with
# "Re-run failed jobs". A tag with no version in npm may be deleted and set again on the fixed commit (CLAUDE.md 8в).

on:
  push:
    tags: ['v*']

# One publication at a time.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Stage 1. It fails in a minute, before the 25 minutes of the checks, when the tag cannot be published at all.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag, the commit and the version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version $VERSION in package.json"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not on main"
            exit 1
          fi
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already in npm"
            exit 1
          fi

  # Stage 2. The same jobs that run on every branch; `needs` waits for all of them.
  checks:
    needs: guard
    uses: ./.github/workflows/ci.yml

  # Stage 3. Only after the guard and every check are green.
  publish:
    needs: [guard, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write # lets npm verify that the publication comes from this workflow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - name: Use npm 11
        run: npm install -g npm@11

      - run: npm ci

      # `npm publish` runs prepublishOnly first: lint, type check, tests and the package build.
      # A pre-release goes under the tag named in its version (0.1.0-alpha.2 -> alpha). While the latest tag
      # itself points to a pre-release, it follows the new one; once a stable version is latest, it stays.
      - name: Publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if [[ "$VERSION" == *-* ]]; then
            TAG="${VERSION#*-}"
            TAG="${TAG%%.*}"
            npm publish --tag "$TAG"
            if [[ "$(npm view "$NAME" dist-tags.latest)" == *-* ]]; then
              npm dist-tag add "$NAME@$VERSION" latest
            fi
          else
            npm publish
          fi
